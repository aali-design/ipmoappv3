name: Inspect Host

on:
  workflow_dispatch:

jobs:
  inspect:
    name: Dump host helper + sudo scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp)
          printf '%s\n' "$PRODUCTION_HOST_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          SSH=(ssh -p "$PRODUCTION_HOST_PORT" -i "$KEY_FILE" -o StrictHostKeyChecking=accept-new -o BatchMode=yes)
          REMOTE="${PRODUCTION_HOST_USER}@${PRODUCTION_HOST}"
          echo "===== id ====="
          "${SSH[@]}" "$REMOTE" 'id' || true
          echo "===== sudo -l ====="
          "${SSH[@]}" "$REMOTE" 'sudo -l 2>&1' || true
          echo "===== ls -la ipmo-publish ====="
          "${SSH[@]}" "$REMOTE" 'ls -la /usr/local/bin/ipmo-publish' || true
          echo "===== ipmo-publish content ====="
          "${SSH[@]}" "$REMOTE" 'cat /usr/local/bin/ipmo-publish' || true
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_HOST_USER: ${{ secrets.PRODUCTION_HOST_USER }}
          PRODUCTION_HOST_PORT: ${{ secrets.PRODUCTION_HOST_PORT }}
          PRODUCTION_HOST_KEY: ${{ secrets.PRODUCTION_HOST_KEY }}
