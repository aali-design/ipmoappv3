name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package release
        run: scripts/package-production.sh

      - name: Deploy production
        run: scripts/deploy-production.sh
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_HOST_USER: ${{ secrets.PRODUCTION_HOST_USER }}
          PRODUCTION_HOST_PORT: ${{ secrets.PRODUCTION_HOST_PORT }}
          PRODUCTION_HOST_KEY: ${{ secrets.PRODUCTION_HOST_KEY }}
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}